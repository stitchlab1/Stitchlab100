    <script>
      // Cleanly register the ultra-lightweight Service Worker for native PWA installation support
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/service-worker.js')
            .then(reg => {
              console.log('StitchLab PWA Service Worker Registered successfully!', reg.scope);
            })
            .catch(err => {
              console.error('Service Worker Registry Bypassed:', err);
            });
        });
      }

      // Defer installation prompt
      window.deferredInstallPrompt = null;
      window.deferredPrompt = null;
      window.addEventListener('beforeinstallprompt', (e) => {
        // Prevent Chrome 67 and earlier from automatically showing the prompt
        e.preventDefault();
        // Stash the event so it can be triggered later.
        window.deferredInstallPrompt = e;
        window.deferredPrompt = e;
        
        // Dispatch a custom event to notify our React app that PWA installation is ready!
        const event = new CustomEvent('pwa-installable', { detail: e });
        window.dispatchEvent(event);
      });
    </script>
